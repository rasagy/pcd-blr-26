<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PCD BLR — Logo Option 4: Radial Type</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #f4efe4;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { position: relative; }
    /* Offscreen probes in all four approved families — forces the browser
       to actually apply each font-face at least once before the sketch's
       first draw, so document.fonts.ready resolves with correct metrics
       for textWidth() (auto-fit ring sizing depends on this). */
    .font-probe {
      position: absolute;
      left: -9999px;
      top: -9999px;
      visibility: hidden;
    }
  </style>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Latin:wght@400;700&family=Space+Mono:wght@400;700&family=Doto:wght@400;700&family=Geist+Pixel&display=swap" rel="stylesheet">

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <!-- p5.gui dependencies (quicksettings + p5.gui), self-hosted for reliability -->
  <script src="lib/quicksettings.js"></script>
  <script src="lib/p5.gui.js"></script>
</head>
<body>
  <span class="font-probe" style="font-family: 'Anek Latin';">Aa</span>
  <span class="font-probe" style="font-family: 'Space Mono';">Aa</span>
  <span class="font-probe" style="font-family: 'Doto';">Aa</span>
  <span class="font-probe" style="font-family: 'Geist Pixel';">Aa</span>

  <main></main>
  <script src="sketch.js"></script>
</body>
</html>
